<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kei-1111 Admin</title>
    <meta name="robots" content="noindex">
    <style>
        html, body, #compose-root {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1E1F22;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script type="application/javascript" src="webApp.js"></script>
</head>
<body>
<!-- ComposeViewport はマウント先の子要素を消すため、Compose は専用 div に隔離する -->
<div id="compose-root"></div>
<!-- Google Sign-In 完了まで全面を覆うオーバーレイ。GIS の callback が非表示化する -->
<div id="signin-overlay" style="position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background-color:#1E1F22;">
    <div id="signin-button"></div>
</div>
</body>
</html>
